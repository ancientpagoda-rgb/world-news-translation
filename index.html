<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Country-by-country news headlines with English translations." />
    <title>World News Translation</title>
    <link rel="stylesheet" href="styles.css?v=9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Armenian:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Ethiopic:wght@400;600;700&family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Sans+Hebrew:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="site-header">
      <h1>World News Translation</h1>
    </header>
    <main>
      <section class="controls" aria-label="News filters">
        <label>Search countries or headlines<input id="search" type="search" placeholder="Try Japan, climate, election..." autocomplete="off" /></label>
        <label>Source language<select id="language"><option value="all">All languages</option></select></label>
        <label class="checkbox-label"><input id="show-all" type="checkbox" /> Show all countries</label>
        <p id="status" class="status" aria-live="polite">Loading...</p>
      </section>
      <section id="news-list" class="news-list" aria-live="polite"></section>
    </main>
    <footer class="site-footer"><a href="https://github.com/ancientpagoda-rgb/world-news-translation">View the source on GitHub</a></footer>
    <script src="vendor/english-cmudict.js?v=2"></script>
    <script src="phonetics-base.js?v=2"></script>
    <script src="language-aware-ipa.js?v=9"></script>
    <script type="module" src="app.js?v=39"></script>
  </body>
</html>
