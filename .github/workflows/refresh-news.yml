name: Refresh translated news

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-translated-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache offline translation models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/argos-translate
            ~/.local/share/argos-translate
            ~/.cache/huggingface
          key: offline-translation-v1-${{ runner.os }}-${{ hashFiles('scripts/translate_headlines_offline.py') }}
          restore-keys: offline-translation-v1-${{ runner.os }}-
      - name: Install translation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install argostranslate==1.11.0 transformers==4.57.6
      - name: Refresh headlines and translations
        run: |
          python scripts/update_headlines_only.py
          python scripts/translate_headlines_offline.py
      - name: Validate
        run: |
          python -m json.tool data/world-news.json > /dev/null
          python -m py_compile scripts/update_headlines_only.py scripts/translate_headlines_offline.py
          npm run check:syntax
          npm run check:data
      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: refresh translated news"
          file_pattern: data/world-news.json
