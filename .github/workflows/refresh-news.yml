name: Refresh GDELT headlines

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-gdelt-headlines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh headlines from GDELT
        run: python scripts/update_headlines_only.py --allow-partial
      - name: Validate
        run: |
          python -m json.tool data/world-news.json > /dev/null
          python -m py_compile scripts/update_headlines_only.py scripts/source-policy-smoke.py
          python scripts/source-policy-smoke.py
          npm run check:syntax
          npm run check:data
      - name: Commit refreshed headlines
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: refresh country headlines"
          file_pattern: data/world-news.json
