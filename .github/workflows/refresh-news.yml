name: Refresh Global Voices articles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-global-voices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh licensed articles
        run: python scripts/update_global_voices.py
      - name: Apply native-language summary translations
        run: python scripts/apply_summary_translations.py
      - name: Validate
        run: |
          python -m json.tool data/world-news.json > /dev/null
          python -m py_compile scripts/update_global_voices.py scripts/apply_summary_translations.py scripts/global-voices-smoke.py
          python scripts/global-voices-smoke.py
          npm run check:syntax
          npm run check:data
      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: refresh Global Voices articles"
          file_pattern: data/world-news.json scripts/summary-translations.json
