name: Refresh approved direct-feed headlines

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Zero-based country row index"
        required: false
        default: "0"
      count:
        description: "Number of rows to process; 0 refreshes all rows"
        required: false
        default: "0"
      timeout:
        description: "Per-feed request timeout in seconds"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: refresh-approved-direct-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh headlines from approved direct feeds
        env:
          FEED_TIMEOUT: ${{ inputs.timeout || '20' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.count }}" != "0" ]; then
            python scripts/update_headlines_only.py --allow-partial --start "${{ inputs.start }}" --count "${{ inputs.count }}"
          else
            python scripts/update_headlines_only.py --allow-partial
          fi
      - name: Cache offline translation model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/pip
          key: ${{ runner.os }}-nllb-600m-${{ hashFiles('scripts/translate_headlines_offline.py') }}
      - name: Install offline translation dependencies
        run: python -m pip install --disable-pip-version-check torch transformers sentencepiece
      - name: Translate new headlines offline
        env:
          NLLB_THREADS: "2"
        run: python scripts/translate_headlines_offline.py
      - name: Validate
        run: |
          python -m json.tool data/world-news.json > /dev/null
          python -m py_compile scripts/update_headlines_only.py scripts/source-policy-smoke.py
          python scripts/source-policy-smoke.py
          npm run check:syntax
          npm run check:data
      - name: Commit refreshed headlines
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: refresh country headlines"
          file_pattern: data/world-news.json
